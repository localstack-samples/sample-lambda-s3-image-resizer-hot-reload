name: Create PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - ./*.md
      - LICENSE
      - .circleci/*

jobs:
  test:
    # DISABLED (lstk): deployment/aws/deploy.sh now uses `lstk aws`, which only
    # targets instances it starts and manages locally. This job's "Deploy Preview"
    # step uses the setup-localstack action's ephemeral state-backend, which hosts
    # LocalStack remotely on LocalStack's cloud API rather than a local container -
    # an endpoint `lstk aws` can't reach or recognize. Ephemeral/remote instances
    # are not supported by lstk, so this job is disabled until that's resolved
    # (e.g. a non-lstk deploy path for this workflow, or lstk gaining remote-target
    # support). Re-enable by removing the `if: false` below.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        id: setup-python
        uses: actions/setup-python@v2
        with:
          python-version: 3.11

      - name: Install lstk
        run: |
          npm install -g @localstack/lstk

      # NOTE(lstk): this step's ephemeral hosting + public preview URL + PR comment
      # is provided by the setup-localstack action itself and has no lstk equivalent
      # (lstk only starts/stops a local container), so it's kept as-is rather than
      # switched to `lstk start`. See the `if: false` note on the job above for why
      # the job itself is currently disabled.
      - name: Deploy Preview
        uses: LocalStack/setup-localstack@main
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          state-backend: ephemeral
          state-action: start
          include-preview: 'true'
          preview-cmd: |
            # Add your custom deployment commands here.
            # Below is an example for the Image resizer application.
            deployment/build-lambdas.sh && deployment/aws/deploy.sh
